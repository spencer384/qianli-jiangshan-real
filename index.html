<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>江山千里 · 實景寫真卷 (3D-Real)</title>
  <style>
    :root {
      --bg: #0f1417;
      --panel: rgba(20, 27, 31, 0.88);
      --border: rgba(168, 198, 186, 0.25);
      --accent: #4ec49b;
      --gold: #f0c975;
      --text: #eef3f1;
      --muted: #9eb0aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Serif TC", "Microsoft JhengHei", sans-serif;
      overflow: hidden;
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: linear-gradient(to bottom, rgba(15, 20, 23, 0.92), rgba(15, 20, 23, 0.4));
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .seal {
      width: 36px; height: 36px;
      background: #b2382b;
      color: #fff4e0;
      display: grid; place-items: center;
      font-size: 12px; font-weight: 700; line-height: 1.05;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .brand h1 { font-size: 16px; color: var(--gold); letter-spacing: 0.6px; }
    .brand p { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .badge-wip {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(240, 201, 117, 0.14);
      border: 1px solid rgba(240, 201, 117, 0.4);
      color: var(--gold);
      margin-left: 8px;
    }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.16); }
    .btn.active {
      background: rgba(78, 196, 155, 0.22);
      border-color: var(--accent);
      color: #ffffff;
    }
    .viewer {
      position: fixed;
      inset: 0;
      padding-top: 64px;
      padding-bottom: 84px;
      display: flex;
      align-items: center;
      overflow-x: auto;
      overflow-y: hidden;
      cursor: grab;
      scroll-behavior: smooth;
    }
    .viewer:active { cursor: grabbing; }
    .panorama-wrap {
      height: calc(100vh - 170px);
      display: flex;
      align-items: center;
      padding: 0 24px;
    }
    .panorama-wrap img {
      height: 100%;
      width: auto;
      max-width: none;
      border-radius: 6px;
      box-shadow: 0 12px 42px rgba(0, 0, 0, 0.65);
      user-select: none;
      -webkit-user-drag: none;
    }
    .gallery {
      display: none;
      position: fixed;
      inset: 64px 0 68px 0;
      overflow-y: auto;
      padding: 20px;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .gallery.active { display: grid; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .card img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }
    .card-body { padding: 10px 12px; font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; }
    .card-body strong { color: var(--text); }
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      padding: 10px 20px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      gap: 12px;
      flex-wrap: wrap;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="seal">實景<br/>江山</div>
      <div>
        <h1>江山千里 · 實景寫真卷 (3D-Real)<span class="badge-wip">第 01–07 段已完成 · 待補齊完整版</span></h1>
        <p>方琮《仿王希孟江山千里卷》現實擬真攝影重構（10,560 × 1,080 無縫拼接長卷）</p>
      </div>
    </div>
    <div class="controls">
      <button id="btn-pano" class="btn active">長卷全景瀏覽</button>
      <button id="btn-gallery" class="btn">已生成分段一覽 (9 張)</button>
      <button id="btn-auto" class="btn">自動橫向漫遊</button>
    </div>
  </header>

  <main id="pano-viewer" class="viewer">
    <div class="panorama-wrap">
      <img id="pano-img" src="./assets/scroll_real_01_to_07.jpg" alt="江山千里實景寫真卷 第01至07段" />
    </div>
  </main>

  <section id="gallery-view" class="gallery"></section>

  <footer>
    <span>左右拖曳、滾輪捲動或啟用「自動橫向漫遊」欣賞長卷 ｜ 第 08、09、11–17 段將於後續更新補齊</span>
    <span><a href="https://spencer384.github.io/" target="_blank">← 返回 風的異想實驗室</a></span>
  </footer>

  <script>
    const viewer = document.getElementById('pano-viewer');
    const gallery = document.getElementById('gallery-view');
    const btnPano = document.getElementById('btn-pano');
    const btnGallery = document.getElementById('btn-gallery');
    const btnAuto = document.getElementById('btn-auto');

    const slices = [
      { title: '精選示範 · 正中主峰與山灣古村', file: './assets/sample_section_real.jpg', tag: '16:9 實景示範' },
      { title: '第 01 段 · 卷尾雙峰與村橋', file: './assets/slices_real/real_01.jpg', tag: '已併入長卷' },
      { title: '第 02 段 · 左端平遠大湖', file: './assets/slices_real/real_02.jpg', tag: '已併入長卷' },
      { title: '第 03 段 · 蘆洲沙嘴與漁村', file: './assets/slices_real/real_03.jpg', tag: '已併入長卷' },
      { title: '第 04 段 · 左中銳峰群', file: './assets/slices_real/real_04.jpg', tag: '已併入長卷' },
      { title: '第 05 段 · 中左層巒山寺', file: './assets/slices_real/real_05.jpg', tag: '已併入長卷' },
      { title: '第 06 段 · 主峰西側群峰', file: './assets/slices_real/real_06.jpg', tag: '已併入長卷' },
      { title: '第 07 段 · 正中特大主峰與飛瀑', file: './assets/slices_real/real_07.jpg', tag: '已併入長卷' },
      { title: '第 10 段 · 右一大主山群', file: './assets/slices_real/real_10.jpg', tag: '單段已完成' },
    ];

    slices.forEach((s) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<img src="${s.file}" alt="${s.title}" loading="lazy" /><div class="card-body"><strong>${s.title}</strong><span>${s.tag}</span></div>`;
      gallery.appendChild(card);
    });

    btnPano.addEventListener('click', () => {
      btnPano.classList.add('active');
      btnGallery.classList.remove('active');
      viewer.style.display = 'flex';
      gallery.classList.remove('active');
    });

    btnGallery.addEventListener('click', () => {
      btnGallery.classList.add('active');
      btnPano.classList.remove('active');
      viewer.style.display = 'none';
      gallery.classList.add('active');
      autoPan = false;
      btnAuto.classList.remove('active');
    });

    let isDown = false;
    let startX = 0;
    let scrollLeft = 0;
    viewer.addEventListener('mousedown', (e) => {
      isDown = true;
      autoPan = false;
      btnAuto.classList.remove('active');
      startX = e.pageX - viewer.offsetLeft;
      scrollLeft = viewer.scrollLeft;
    });
    window.addEventListener('mouseup', () => { isDown = false; });
    viewer.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - viewer.offsetLeft;
      viewer.scrollLeft = scrollLeft - (x - startX) * 1.4;
    });
    viewer.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        viewer.scrollLeft += e.deltaY * 1.6;
      }
    }, { passive: false });

    let autoPan = false;
    let dir = 1;
    btnAuto.addEventListener('click', () => {
      autoPan = !autoPan;
      btnAuto.classList.toggle('active', autoPan);
    });
    function tick() {
      if (autoPan && viewer.style.display !== 'none') {
        viewer.scrollLeft += 1.2 * dir;
        if (viewer.scrollLeft + viewer.clientWidth >= viewer.scrollWidth - 2) dir = -1;
        else if (viewer.scrollLeft <= 0) dir = 1;
      }
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
